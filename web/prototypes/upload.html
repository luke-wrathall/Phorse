<title>Post a Horse</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  /* ==========================================================================
     horse — post a horse (prototype)

     Same plain HTML + hand-written stylesheet as feed.html. The block from
     :root down to "footer" is copied verbatim from feed.html — keep them in
     sync. The "form" and "result" sections at the end are specific to this
     page.
     ========================================================================== */

  :root {
    --page-width: 40rem;
    --ink: #1a1a1a;          /* body text */
    --meta: #555;            /* small print, help text */
    --link: #1a0dab;         /* the old web link blue */
    --link-visited: #6b1a8b;
    --rule: #bcbcbc;         /* borders and <hr> */
    --name: #7a1f1f;         /* the site name */
    --paper: #fbfbf7;        /* page background */
  }

  /* --- page --- */
  html { background: var(--paper); }
  body {
    max-width: var(--page-width);
    margin: 0 auto;
    padding: 1rem 1.25rem 4rem;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.65 Georgia, "Times New Roman", Times, serif;
  }
  a { color: var(--link); }
  a:visited { color: var(--link-visited); }
  hr { border: none; border-top: 1px solid var(--rule); margin: 1.25rem 0; }
  h2 { font-size: 1.3rem; margin: 1.2rem 0 0.3rem; }

  /* --- masthead --- */
  .masthead h1 {
    margin: 0 0 0.1rem;
    font-size: 1.7rem;
    color: var(--name);
  }
  .masthead .tagline { margin: 0; color: var(--meta); font-size: 0.95rem; }
  .masthead nav { margin-top: 0.5rem; font-size: 0.95rem; }
  .masthead nav a { text-decoration: none; }
  .masthead nav a:hover { text-decoration: underline; }

  /* --- footer --- */
  footer { margin-top: 1.5rem; color: var(--meta); font-size: 0.9rem; }
  footer p { margin: 0.4rem 0; }

  /* --- the form (this page) --- */
  form { margin: 1rem 0; }
  fieldset {
    border: 1px solid var(--rule);
    padding: 0.8rem 1rem 1.1rem;
    margin: 0;
  }
  legend { font-weight: bold; padding: 0 0.4rem; }
  label { display: block; margin: 0.8rem 0 0.2rem; }
  input[type="text"] {
    font: inherit;
    width: 100%;
    max-width: 24rem;
    padding: 0.35rem 0.4rem;
    border: 1px solid #888;
    background: #fff;
  }
  input[type="file"] { font: inherit; margin: 0.2rem 0; }
  button[type="submit"] {
    display: block;          /* its own line, below the fields */
    font-family: inherit;
    font-size: 0.9rem;
    margin-top: 0.9rem;
    padding: 0.15rem 0.7rem;
    border: 1px solid #999;
    border-radius: 3px;
    background: #ececec;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: #e0e0e0; }
  .note { color: var(--meta); font-size: 0.95rem; }

  /* --- the result ---
     One of these replaces the form after you post. Both are shown here so
     you can see each state; delete whichever you don't need while editing.
     Plain box, same border as everything else — the wording carries which
     one it is, not the colour. */
  .result {
    border: 1px solid var(--rule);
    background: #fff;
    padding: 0.6rem 1rem;
    margin: 1rem 0;
  }
  .result p { margin: 0.3rem 0; }
</style>

<header class="masthead">
  <h1>phorse</h1>
  <p class="tagline">pictures of horses, decide how horsey they really are</p>
  <nav>
    <a href="#">the feed</a> &nbsp;|&nbsp;
    <a href="#">post a horse</a> &nbsp;|&nbsp;
    <a href="#">your page</a> &nbsp;|&nbsp;
    <a href="#">log out</a>
  </nav>
</header>

<hr />

<main>
  <h2>post a horse</h2>

  <form>
    <fieldset>
      <legend>your picture</legend>
      <label for="f">choose a file</label>
      <input type="file" id="f" name="image" accept="image/*" />
      <label for="c">say something about it (optional)</label>
      <input type="text" id="c" name="caption" />
      <button type="submit">post it</button>
    </fieldset>
  </form>

  <p class="note">
    every picture has to pass the horse test
  </p>

  <!-- one of these replaces the form after you post -->
  <div class="result">
    <p><b>your horse is up.</b> <a href="#">see it in the feed &rarr;</a></p>
  </div>

  <div class="result">
    <p><b> not horse enough!</b></p>
  </div>
</main>

<hr />

<footer>
  <p><span id="whatis">horse is a website</span>. <a href="#">about</a> &nbsp;&middot;&nbsp; <a href="#">rules</a></p>
</footer>

<script>
  /* now and then, the website is a horse instead */
  if (Math.random() < 0.15) {
    document.getElementById("whatis").textContent = "website is a horse";
  }
</script>
